    <rect x="620" y="204" width="230" height="28" rx="14" fill="#121A2E" stroke="#1E293B"/>
    <circle cx="638" cy="217" r="5" stroke="#64748B"/>
    <path d="M642 221 L648 227" stroke="#64748B" stroke-width="1.5"/>
    <text x="656" y="222" font-size="10" fill="#64748B">Buscar...</text>
    <rect x="870" y="204" width="30" height="28" rx="14" fill="#121A2E"/>
    <path d="M879 221 V216 C879 211 882 208 885 208 C888 208 891 211 891 216 V221 L894 224 H876 Z" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="885" cy="210" r="3" fill="#34D399"/>
    <circle cx="940" cy="218" r="14" fill="url(#violet)"/>
    <text x="940" y="222" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">PO</text>

