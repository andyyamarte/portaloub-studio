<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" fill="none" font-family="Segoe UI, system-ui, sans-serif" role="img" aria-label="Captura realista de la página web de PortalOub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141032"/><stop offset=".55" stop-color="#0D1226"/><stop offset="1" stop-color="#07121E"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/><stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1B2340"/><stop offset="1" stop-color="#111830"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="1100" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="180" cy="150" r="210" fill="#7C3AED" opacity=".45" filter="url(#blur)"/>
  <circle cx="930" cy="780" r="230" fill="#06B6D4" opacity=".3" filter="url(#blur)"/>

  <g filter="url(#shadow)">
    <!-- Ventana del navegador -->
    <rect x="70" y="120" width="960" height="650" rx="22" fill="#0F172A" stroke="#334155"/>

    <!-- Barra superior del navegador -->
    <path d="M92 120 H1008 Q1030 120 1030 142 V182 H70 V142 Q70 120 92 120 Z" fill="#111827"/>
    <line x1="70" y1="182" x2="1030" y2="182" stroke="#1F2937"/>
    <circle cx="94" cy="141" r="6" fill="#FB7185"/>
    <circle cx="114" cy="141" r="6" fill="#FBBF24"/>
    <circle cx="134" cy="141" r="6" fill="#34D399"/>

    <!-- Pestañas -->
    <rect x="158" y="128" width="220" height="28" rx="8" fill="#1F2937"/>
    <circle cx="175" cy="142" r="5" fill="url(#violet)"/>
    <text x="188" y="147" font-size="11" fill="#E5E7EB">PortalOub — Inicio</text>
    <rect x="388" y="128" width="120" height="28" rx="8" fill="#151D2E"/>
    <text x="402" y="147" font-size="11" fill="#94A3B8">Demos</text>

    <!-- Barra de dirección -->
    <text x="90" y="175" font-size="19" fill="#64748B">‹</text>
    <text x="116" y="175" font-size="19" fill="#475569">›</text>
    <text x="140" y="175" font-size="15" fill="#64748B">↻</text>
    <rect x="170" y="160" width="520" height="22" rx="11" fill="#0B1220" stroke="#1F2937"/>
    <circle cx="185" cy="171" r="4" fill="#34D399"/>
    <text x="197" y="175" font-size="10" fill="#94A3B8">https://portaloub.com</text>
    <text x="712" y="175" font-size="14" fill="#64748B">☆</text>
    <rect x="736" y="161" width="22" height="20" rx="5" fill="#1F2937"/>
    <text x="747" y="175" font-size="10" fill="#94A3B8" text-anchor="middle">▦</text>
    <circle cx="982" cy="171" r="12" fill="url(#violet)"/>
    <text x="982" y="175" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">PO</text>

    <!-- Contenido de la página -->
    <rect x="70" y="182" width="960" height="570" fill="#0B1020"/>
    <path d="M70 740 V748 Q70 770 92 770 H1008 Q1030 770 1030 748 V740 Z" fill="#0B1020"/>

