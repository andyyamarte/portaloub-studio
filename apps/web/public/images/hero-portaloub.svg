    <rect x="70" y="182" width="190" height="588" fill="#0E1526"/>
    <line x1="260" y1="182" x2="260" y2="770" stroke="#1E293B"/>
    <rect x="92" y="206" width="36" height="36" rx="10" fill="url(#violet)"/>
    <text x="110" y="231" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">PO</text>
    <text x="138" y="221" font-size="13" font-weight="700" fill="#F8FAFC">PortalOub</text>
    <text x="138" y="237" font-size="9" fill="#64748B">Estudio web</text>

    <rect x="86" y="266" width="158" height="36" rx="10" fill="#8B5CF6" fill-opacity=".18"/>
    <rect x="86" y="266" width="3" height="36" rx="1.5" fill="#8B5CF6"/>
    <circle cx="106" cy="284" r="5" fill="#A78BFA"/>
    <text x="122" y="289" font-size="12" fill="#F8FAFC">Inicio</text>

    <circle cx="106" cy="332" r="5" fill="#475569"/>
    <text x="122" y="337" font-size="12" fill="#94A3B8">Servicios</text>
    <circle cx="106" cy="380" r="5" fill="#475569"/>
    <text x="122" y="385" font-size="12" fill="#94A3B8">Proyectos</text>
    <circle cx="106" cy="428" r="5" fill="#475569"/>
    <text x="122" y="433" font-size="12" fill="#94A3B8">Mensajes</text>
    <circle cx="106" cy="476" r="5" fill="#475569"/>
    <text x="122" y="481" font-size="12" fill="#94A3B8">Ajustes</text>

    <rect x="86" y="650" width="158" height="90" rx="14" fill="#121A2E" stroke="#1E293B"/>
