    <text x="310" y="300" font-size="10" fill="#94A3B8">Visitas este mes</text>
    <text x="310" y="336" font-size="28" font-weight="700" fill="#F8FAFC">1.284</text>
    <text x="310" y="360" font-size="10" fill="#34D399">↑ 12,4% vs. mes anterior</text>
    <path d="M430 342 L442 332 L454 336 L466 316 L478 324" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="520" y="274" width="210" height="104" rx="14" fill="#121A2E" stroke="#1E293B"/>
    <text x="540" y="300" font-size="10" fill="#94A3B8">Conversión</text>
    <text x="540" y="336" font-size="28" font-weight="700" fill="#F8FAFC">38%</text>
    <text x="540" y="360" font-size="10" fill="#34D399">↑ 5,2% esta semana</text>
    <path d="M660 340 L672 326 L684 330 L696 310 L708 314" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="750" y="274" width="210" height="104" rx="14" fill="#121A2E" stroke="#1E293B"/>
    <text x="770" y="300" font-size="10" fill="#94A3B8">Ingresos</text>
    <text x="770" y="336" font-size="28" font-weight="700" fill="#F8FAFC">$12.450</text>
    <text x="770" y="360" font-size="10" fill="#34D399">↑ 8,7% este trimestre</text>
    <path d="M890 342 L902 334 L914 338 L926 318 L938 310" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tarjeta principal -->
    <rect x="290" y="400" width="470" height="250" rx="18" fill="url(#card)" stroke="#2A3358"/>
    <text x="320" y="436" font-size="10" letter-spacing="1.5" fill="#A78BFA">DISEÑO Y DESARROLLO WEB</text>
    <text x="320" y="476" font-size="27" font-weight="700" fill="#F8FAFC">Tu próxima página,</text>
    <text x="320" y="510" font-size="27" font-weight="700" fill="#67E8F9">hagámoslo realidad.</text>
    <text x="320" y="540" font-size="11" fill="#94A3B8">Diseño y desarrollo que convierte visitantes en clientes.</text>
    <rect x="320" y="566" width="150" height="40" rx="20" fill="url(#violet)"/>
    <text x="395" y="592" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Hablemos →</text>
    <rect x="482" y="566" width="130" height="40" rx="20" fill="#1E293B" stroke="#334155"/>
    <text x="547" y="592" font-size="12" fill="#CBD5E1" text-anchor="middle">Ver demos</text>

    <!-- Miniatura de otra página -->
    <rect x="780" y="400" width="200" height="250" rx="18" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="798" cy="420" r="3" fill="#FB7185"/>
    <circle cx="810" cy="420" r="3" fill="#FBBF24"/>
    <circle cx="822" cy="420" r="3" fill="#34D399"/>
    <rect x="836" y="414" width="120" height="12" rx="6" fill="#1E293B"/>
    <text x="842" y="423" font-size="7" fill="#64748B">portaloub.com</text>
    <rect x="796" y="440" width="168" height="196" rx="10" fill="#101830"/>
    <rect x="806" y="450" width="148" height="70" rx="8" fill="url(#violet)" fill-opacity=".9"/>
    <text x="818" y="474" font-size="9" font-weight="700" fill="#fff">Tu marca,</text>
    <text x="818" y="488" font-size="9" font-weight="700" fill="#fff">en internet.</text>
    <rect x="818" y="500" width="54" height="12" rx="6" fill="#22D3EE"/>
    <circle cx="930" cy="484" r="24" fill="#0B1220" fill-opacity=".45"/>
    <rect x="806" y="532" width="46" height="32" rx="8" fill="#1E293B"/>
    <rect x="856" y="532" width="46" height="32" rx="8" fill="#1E293B"/>
    <rect x="906" y="532" width="46" height="32" rx="8" fill="#1E293B"/>
    <circle cx="829" cy="548" r="6" fill="#8B5CF6" fill-opacity=".5"/>
    <circle cx="879" cy="548" r="6" fill="#22D3EE" fill-opacity=".5"/>
    <circle cx="929" cy="548" r="6" fill="#34D399" fill-opacity=".5"/>
    <rect x="812" y="558" width="34" height="4" rx="2" fill="#334155"/>
    <rect x="862" y="558" width="34" height="4" rx="2" fill="#334155"/>
    <rect x="912" y="558" width="34" height="4" rx="2" fill="#334155"/>
    <rect x="806" y="576" width="146" height="8" rx="4" fill="#1E293B"/>
    <rect x="806" y="592" width="112" height="8" rx="4" fill="#1E293B"/>
    <rect x="806" y="612" width="92" height="14" rx="7" fill="url(#cyan)"/>

    <!-- Servicios -->
    <rect x="290" y="670" width="210" height="80" rx="14" fill="#121A2E" stroke="#1E293B"/>
    <rect x="310" y="690" width="30" height="30" rx="9" fill="#8B5CF6" fill-opacity=".2"/>
    <text x="325" y="710" font-size="10" font-weight="700" fill="#A78BFA" text-anchor="middle">01</text>
    <text x="352" y="703" font-size="11" font-weight="600" fill="#F8FAFC">Landing Page</text>
    <text x="352" y="720" font-size="9" fill="#64748B">Alta conversión</text>

    <rect x="520" y="670" width="210" height="80" rx="14" fill="#121A2E" stroke="#1E293B"/>
    <rect x="540" y="690" width="30" height="30" rx="9" fill="#22D3EE" fill-opacity=".2"/>
    <text x="555" y="710" font-size="10" font-weight="700" fill="#67E8F9" text-anchor="middle">02</text>
    <text x="582" y="703" font-size="11" font-weight="600" fill="#F8FAFC">Tienda Online</text>
    <text x="582" y="720" font-size="9" fill="#64748B">Carrito y checkout</text>

    <rect x="750" y="670" width="210" height="80" rx="14" fill="#121A2E" stroke="#1E293B"/>
    <rect x="770" y="690" width="30" height="30" rx="9" fill="#34D399" fill-opacity=".2"/>
    <text x="785" y="710" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">03</text>
    <text x="812" y="703" font-size="11" font-weight="600" fill="#F8FAFC">Dashboard</text>
